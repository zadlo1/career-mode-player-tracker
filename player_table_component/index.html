<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }

  function setHeight() {
    send("streamlit:setFrameHeight", { height: document.documentElement.scrollHeight });
  }

  window.addEventListener("message", function (event) {
    if (event.data.type !== "streamlit:render") return;
    var theme = event.data.theme || {};
    document.body.style.color = theme.textColor || "";
    document.body.style.fontFamily = theme.font || "sans-serif";

    var root = document.getElementById("root");
    root.innerHTML = event.data.args.html;
    root.querySelectorAll("[data-pid]").forEach(function (el) {
      el.addEventListener("click", function () {
        send("streamlit:setComponentValue", {
          value: { id: parseInt(el.dataset.pid, 10), t: Date.now() },
          dataType: "json",
        });
      });
    });
    setHeight();
  });

  new ResizeObserver(setHeight).observe(document.body);
  send("streamlit:componentReady", { apiVersion: 1 });
  setHeight();
</script>
</body>
</html>
