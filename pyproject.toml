[project]
name = "career-mode-tracker"
version = "0.1.0"
description = "Aplikacja do prowadzenia własnej bazy kariery w EA FC: zawodnicy, sezony, kluby i rozgrywki."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
]

[project.scripts]
careertracker = "careertracker.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careertracker"]

[tool.fastapi]
entrypoint = "careertracker.web.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (błędy)
    "W",   # pycodestyle (ostrzeżenia)
    "F",   # pyflakes
    "I",   # kolejność importów
    "UP",  # nowsza składnia Pythona
    "B",   # typowe błędy (flake8-bugbear)
    "SIM", # uproszczenia kodu
    "C4",  # czytelniejsze comprehensions
]
